[project]
name = "parcelwise"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[pool]==3.2.3",
    "httpx==0.27.2",
    "sentry-sdk==2.73.0",
    "stripe==11.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.4"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
