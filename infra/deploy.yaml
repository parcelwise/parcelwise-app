# Deployed by CI on merge to main. Staging first, production after the smoke test passes.
app: parcelwise-api
primary_region: sjc

services:
  api:
    command: gunicorn app.api.wsgi:app --workers 4 --timeout 30
    instances: 2
    autoscale: { min: 2, max: 4, target_cpu: 60 }
    memory: 1024mb
    healthcheck: /healthz
    env:
      DATABASE_POOL_SIZE: "10"
      STATEMENT_TIMEOUT_MS: "5000"

  # Bulk label purchases (app/workers/label_worker.py). Exactly one instance: the 40/min USPS limit per
  # merchant is enforced in-process.
  label-worker:
    command: python -m app.workers.label_worker
    instances: 1
    memory: 512mb
    env:
      DATABASE_POOL_SIZE: "2"
      STATEMENT_TIMEOUT_MS: "5000"

release_command: python -m scripts.migrate
