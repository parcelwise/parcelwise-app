# Deployed by CI on merge to main. Staging first, production after the smoke test passes.
app: parcelwise-api
primary_region: sjc

services:
  api:
    command: gunicorn app.api.wsgi:app --workers 4 --timeout 30
    instances: 2
    autoscale: { min: 2, max: 4, target_cpu: 60 }
    memory: 1024mb
    healthcheck: /healthz
    env:
      DATABASE_POOL_SIZE: "10"
      STATEMENT_TIMEOUT_MS: "5000"

  # Buys labels for batches queued from the Orders page. Exactly one instance: the per-account carrier rate limit
  # (app/labels/carriers.py PURCHASES_PER_MINUTE) is kept in this process.
  label-worker:
    command: python -m app.labels.worker
    instances: 1
    autoscale: { min: 1, max: 1 }
    memory: 512mb
    env:
      DATABASE_POOL_SIZE: "2"

release_command: python -m scripts.migrate
